name: Build Revisa APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Test runtime packager
        run: python3 tools/test_prepare_runtime.py

      - name: Install pinned NDK for PRoot
        run: sdkmanager "ndk;27.2.12479018"

      - name: Test PRoot and Codex configuration
        run: python3 tools/test_runtime_compatibility.py

      - name: Prepare pinned ARM64 runtime
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" python3 tools/prepare_runtime.py

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Revisa-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
